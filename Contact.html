<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Van Vallis Photography</title>
    <style>
        :root { 
            --dark: #1a1a1a; 
            --accent: #d4af37; 
            --light: #f4f7f6;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6; 
            margin: 0; 
            color: var(--dark); 
            background-color: var(--light);
            /* Removed the 'flex' and 'height' that was breaking the layout */
        }

        header {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('photos/back.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed; 
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        nav { 
            background: #f8f8f8; 
            padding: 1rem; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            border-bottom: 1px solid #ddd; 
            z-index: 1000; 
        }

        nav a { 
            margin: 0 15px; 
            text-decoration: none; 
            color: var(--dark); 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 0.9rem; 
        }

        section { 
            padding: 4rem 10%; 
            max-width: 1200px; 
            margin: auto; 
        }

        h2 { 
            border-bottom: 2px solid var(--accent); 
            display: inline-block; 
            margin-bottom: 2rem; 
            color: #333;
        }

        .contact-info { 
            background: #ffffff; 
            padding: 2rem; 
            border-radius: 8px; 
            border-left: 5px solid var(--accent); 
            text-align: left; 
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .form-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px; /* Made slightly wider for better desktop view */
            margin: 0 auto;
            text-align: left; /* Aligns labels to the left */
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; 
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--dark);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: var(--accent);
            color: var(--dark);
        }

        footer { 
            background: var(--dark); 
            color: white; 
            text-align: center; 
            padding: 2rem; 
            margin-top: 3rem; 
        }
    </style>
</head>
<body>

    <header>
        <h1>VAN VALLIS PHOTOGRAPHY</h1>
        <p>Let's Chat</p>
    </header>

    <nav>
        <a href="index.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="pricing.html">Pricing</a>
        <a href="contact.html">Contact</a>
    </nav>

    <section>
        <h2>Get In Touch</h2>
        <div class="contact-info">
            <p>Ready to book your session or have a few questions? I'd love to hear from you!</p>
            <p><strong>Email:</strong> Vanvallis.photography@gmail.com</p>
            <p><strong>Socials:</strong> @Vanvallis.photography</p>
        </div>

    <div class="form-container">
        <h2>Send a Message</h2>
        <form action="https://formspree.io/f/xwvagwkk" method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="contact-method">Preferred Contact Method</label>
            <select id="contact-method" name="contact-method">
                <option value="email">Email</option>
                <option value="phone">Phone Call</option>
                <option value="text">Text Message</option>
            </select>

            <label for="comments">Comments</label>
            <textarea id="comments" name="comments" rows="5" placeholder="Tell me about your vision for the shoot..." required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </div>
</section>
    <footer>
        <p>&copy; 2026 Van Vallis Photography</p>
    </footer>

</body>
</html>
