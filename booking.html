<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Van Vallis Photography</title>
    <style>
        :root { --dark: #1a1a1a; --accent: #d4af37; --light: #f4f4f4; }
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; margin: 0; color: var(--dark); background: #fff; }
        header { background: var(--dark); color: white; padding: 3rem 0; text-align: center; }
        nav { background: #f8f8f8; padding: 1rem; text-align: center; border-bottom: 1px solid #ddd; }
        nav a { margin: 0 15px; text-decoration: none; color: var(--dark); font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
        
        section { padding: 4rem 10%; max-width: 800px; margin: auto; }
        h2 { border-bottom: 2px solid var(--accent); display: inline-block; margin-bottom: 2rem; }

        /* Form Styling */
        .booking-form { background: var(--light); padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="date"], textarea {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem;
        }
        .time-options { display: flex; gap: 20px; margin-top: 10px; }
        .time-options label { font-weight: normal; display: flex; align-items: center; gap: 5px; }
        
        .submit-btn { 
            background: var(--dark); color: white; border: none; padding: 15px 30px; 
            font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 4px; width: 100%; transition: 0.3s;
        }
        .submit-btn:hover { background: var(--accent); color: var(--dark); }

        footer { background: var(--dark); color: white; text-align: center; padding: 2rem; margin-top: 3rem; }
    </style>
</head>
<body>
    <header>
        <h1>VAN VALLIS PHOTOGRAPHY</h1>
        <p>Let's Capture Your Story</p>
    </header>

    <nav>
        <a href="index.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="pricing.html">Pricing</a>
        <a href="contact.html">Contact</a>
    </nav>

    <section>
        <h2>Book Your Session</h2>
        <form action="https://formspree.io/f/mdayqwjl" method="POST" class="booking-form">
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="First and Last Name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" placeholder="(555) 555-5555" required>
            </div>

            <div class="form-group">
                <label>Preferred Date</label>
                <input type="date" name="date" required>
            </div>

            <div class="form-group">
                <label>Preferred Time of Day (Select all that apply)</label>
                <div class="time-options">
                    <label><input type="checkbox" name="time" value="Morning"> Morning</label>
                    <label><input type="checkbox" name="time" value="Noon"> Noon</label>
                    <label><input type="checkbox" name="time" value="Night"> Night</label>
                </div>
            </div>

            <div class="form-group">
                <label>Comments / Vision for the shoot</label>
                <textarea name="message" rows="5" placeholder="Tell me about what you're looking for..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Booking Request</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Van Vallis Photography</p>
    </footer>
</body>
</html>
