<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Van Vallis Photography</title>
    <style>
        :root { --dark: #1a1a1a; --accent: #d4af37; }
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; margin: 0; color: var(--dark); }
       header {
    background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('photos/back.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed; 
   
    min-height: 400px;
    
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
}
        nav { background: #f8f8f8; padding: 1rem; text-align: center; position: sticky; top: 0; border-bottom: 1px solid #ddd; z-index: 1000; }
        nav a { margin: 0 15px; text-decoration: none; color: var(--dark); font-weight: bold; text-transform: uppercase; font-size: 0.9rem; }
        section { padding: 4rem 10%; max-width: 1200px; margin: auto; }
        h2 { border-bottom: 2px solid var(--accent); display: inline-block; margin-bottom: 2rem; }
        
.gallery {
    display: flex;          
    flex-wrap: wrap;       
    gap: 15px;     
    justify-content: center;
}

.gallery-item {
    width: 200px;        
    height: 200px;      
    background: #f4f4f4;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
}

.gallery-item img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;    /* Shows the whole image without cropping */
    padding: 10px;          /* Adds a little "frame" space inside the box */
    box-sizing: border-box;
}
        
        footer { background: var(--dark); color: white; text-align: center; padding: 2rem; margin-top: 3rem; }
    </style>
</head>
<body>
    <header>
        <h1>VAN VALLIS PHOTOGRAPHY</h1>
        <p>Portfolio</p>
    </header>

    <nav>
        <a href="index.html">About</a>
        <a href="Portfolio.html">Portfolio</a>
         <a href="Pricing.html">Pricing</a>
        <a href="Contact.html">Contact</a>

    </nav>

    <section>
        <h2>My Work</h2>
        <div class="gallery">
            <div class="gallery-item"><img src="./photos/IMG_7913.jpg" alt="Photography Sample 1"></div>
            <div class="gallery-item"><img src="./photos/IMG_7905.JPG" alt="Photography Sample 2"></div>
            <div class="gallery-item"><img src="./photos/DSCN0380.JPG" alt="Photography Sample 3"></div>
              <div class="gallery-item"><img src="./photos/3.JPG" alt="Photography Sample 5"></div>
              <div class="gallery-item"><img src="./photos/4.jpg" alt="Photography Sample 6"></div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Van Vallis Photography</p>
    </footer>
</body>
</html>
